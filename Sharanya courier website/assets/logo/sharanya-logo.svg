<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#1A3A68" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B35" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Mark (Parcel Box + Speed Wings) -->
  <g transform="translate(10, 10)">
    <!-- Speed Wings / Motion Trails -->
    <path d="M 5,30 Q 35,5 65,22 Q 40,38 5,30 Z" fill="url(#orangeGrad)" opacity="0.85" />
    <path d="M 0,50 Q 40,25 75,42 Q 45,60 0,50 Z" fill="url(#orangeGrad)" filter="url(#glow)" />
    <path d="M 10,72 Q 45,52 80,68 Q 50,82 10,72 Z" fill="url(#orangeGrad)" opacity="0.75" />

    <!-- 3D Isometric Parcel Box -->
    <g transform="translate(42, 18)">
      <!-- Top Face -->
      <polygon points="30,0 60,15 30,30 0,15" fill="#FF8800" />
      <!-- Left Face -->
      <polygon points="0,15 30,30 30,65 0,50" fill="#0B1F3A" />
      <!-- Right Face -->
      <polygon points="30,30 60,15 60,50 30,65" fill="#1A3A68" />
      <!-- Box Tape Detail -->
      <polygon points="24,3 36,9 36,27 24,21" fill="#FF6B35" opacity="0.9" />
      <!-- Checkmark/Speed Swoosh across box -->
      <path d="M-5,35 L20,55 L65,15" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 42)">
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="40" fill="#0B1F3A" letter-spacing="-0.5">
      Sharanya
    </text>
    <text x="2" y="58" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="14" fill="#FF6B35" letter-spacing="3">
      COURIER SERVICE
    </text>
  </g>
</svg>
